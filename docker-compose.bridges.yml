  mautrix-gmessages-bridge:
    image: ghcr.io/sergej19882906/matrixtalk-mautrix-gmessages:latest
    build:
      context: docker/mautrix-gmessages
    container_name: matrix-talk-mautrix-gmessages-bridge
    restart: unless-stopped
    profiles: ["bridges"]
    volumes:
