# ARM64 override. Verify each pinned upstream tag includes an arm64 manifest;
# an explicit platform cannot make an unsupported image multi-architecture.
services:
  synapse:
    platform: linux/arm64

  postgres:
    platform: linux/arm64

  coturn:
    platform: linux/arm64

  init-bridges-db:
    platform: linux/arm64

  synapse-admin:
    platform: linux/arm64

  ntfy:
    platform: linux/arm64

  telegram-bridge:
    platform: linux/arm64

  whatsapp-bridge:
    platform: linux/arm64

  signal-bridge:
    platform: linux/arm64

  mautrix-meta-bridge:
    platform: linux/arm64

  mautrix-gmessages-bridge:
    platform: linux/arm64

  mautrix-discord-bridge:
    platform: linux/arm64

  heisenbridge:
    platform: linux/arm64

  hookshot:
    platform: linux/arm64
