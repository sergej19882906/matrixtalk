  <rect x="82" y="738" width="56" height="30" rx="15" fill="#2A2F36"/>
  <text x="110" y="759" fill="#EDF0F3" font-family="sans-serif" font-size="13" text-anchor="middle">Чаты</text>
  <text x="110" y="790" fill="#A9B2BC" font-family="sans-serif" font-size="11" text-anchor="middle">Чаты</text>
  <text x="250" y="759" fill="#6F7882" font-family="sans-serif" font-size="13" text-anchor="middle">Контакты</text>
  <text x="250" y="790" fill="#6F7882" font-family="sans-serif" font-size="11" text-anchor="middle">Контакты</text>
