  <text x="82" y="234" fill="#A9B2BC" font-family="sans-serif" font-size="13">Как дела?</text>
  <text x="344" y="212" fill="#A9B2BC" font-family="sans-serif" font-size="12" text-anchor="end">12:40</text>
  <rect x="316" y="222" width="28" height="20" rx="10" fill="#0DBD8B"/>
  <text x="330" y="236" fill="#000" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text>

  <rect x="16" y="258" width="52" height="52" rx="20" fill="#368BD6"/>
  <text x="42" y="291" fill="#fff" font-family="sans-serif" font-size="20" text-anchor="middle">M</text>
  <text x="82" y="280" fill="#EDF0F3" font-family="sans-serif" font-size="16">Matrix HQ</text>
  <text x="82" y="302" fill="#A9B2BC" font-family="sans-serif" font-size="13">Вы: Привет всем!</text>
  <text x="344" y="280" fill="#A9B2BC" font-family="sans-serif" font-size="12" text-anchor="end">Пн</text>

  <rect x="16" y="326" width="52" height="52" rx="20" fill="#FF812D"/>
  <text x="42" y="359" fill="#fff" font-family="sans-serif" font-size="20" text-anchor="middle">D</text>
  <text x="82" y="348" fill="#EDF0F3" font-family="sans-serif" font-size="16">Design Team</text>
  <text x="82" y="370" fill="#A9B2BC" font-family="sans-serif" font-size="13">Аня: макеты готовы</text>
  <text x="344" y="348" fill="#A9B2BC" font-family="sans-serif" font-size="12" text-anchor="end">Вчера</text>

  <!-- FAB -->
  <rect x="196" y="620" width="148" height="52" rx="26" fill="#0DBD8B"/>
  <text x="248" y="653" fill="#000" font-family="sans-serif" font-size="24" text-anchor="middle">+</text>
  <text x="306" y="652" fill="#000" font-family="sans-serif" font-size="15" font-weight="600">Чат</text>

