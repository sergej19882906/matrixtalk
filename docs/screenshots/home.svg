<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
  <rect width="360" height="800" fill="#15191E"/>
  <!-- top bar: title + search + account avatar -->
  <text x="20" y="48" fill="#EDF0F3" font-family="sans-serif" font-size="24" font-weight="700">Чаты</text>
  <circle cx="296" cy="40" r="14" fill="none" stroke="#A9B2BC" stroke-width="2"/>
