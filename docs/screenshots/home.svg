  <circle cx="334" cy="41" r="16" fill="#AC3BA8"/>
  <text x="334" y="47" fill="#fff" font-family="sans-serif" font-size="14" text-anchor="middle">С</text>

  <!-- search pill -->
  <rect x="16" y="76" width="328" height="44" rx="22" fill="#1C2025" stroke="#2F353B"/>
  <circle cx="40" cy="98" r="7" fill="none" stroke="#6F7882" stroke-width="2"/>
