  <rect x="0" y="700" width="360" height="100" fill="#1C2025"/>
  <circle cx="34" cy="750" r="13" fill="none" stroke="#A9B2BC" stroke-width="2"/>
  <circle cx="30" cy="750" r="5" fill="#A9B2BC"/><circle cx="38" cy="745" r="2.5" fill="#A9B2BC"/><circle cx="38" cy="755" r="2.5" fill="#A9B2BC"/>
  <rect x="56" y="724" width="220" height="52" rx="26" fill="#101317" stroke="#424750"/>
