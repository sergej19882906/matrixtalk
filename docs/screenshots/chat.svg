  <circle cx="330" cy="750" r="22" fill="#0DBD8B"/>
  <path d="M322 750h14m-5-6 6 6-6 6" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="786" fill="#59616B" font-family="sans-serif" font-size="10" text-anchor="middle">Иллюстративный макет интерфейса</text>
