  <text x="313" y="440" fill="#EDF0F3" font-family="sans-serif" font-size="12" text-anchor="middle">👍 2</text>

  <!-- incoming with reaction -->
  <circle cx="36" cy="508" r="16" fill="#AC3BA8"/>
  <rect x="60" y="474" width="150" height="42" rx="16" fill="#31363D"/>
  <text x="76" y="501" fill="#EDF0F3" font-family="sans-serif" font-size="14">Отлично 👌</text>
  <text x="226" y="534" fill="#6F7882" font-family="sans-serif" font-size="11">12:41</text>

