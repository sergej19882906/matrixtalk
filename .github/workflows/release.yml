name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Set up signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > matrix-messenger.jks
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          keystore.file=matrix-messenger.jks
          keystore.alias=${{ secrets.KEYSTORE_ALIAS }}
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.password=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: ./gradlew :app:assembleRelease

      - name: Build debug APK (no signing secrets)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: ./gradlew :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/MatrixTalk-${{ github.ref_name }}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/MatrixTalk-${{ github.ref_name }}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            format: msi
            glob: '*.msi'
          - os: ubuntu-latest
            task: packageDeb
            format: deb
            glob: '*.deb'
          - os: macos-latest
            task: packageDmg
            format: dmg
            glob: '*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Package ${{ matrix.format }}
        shell: bash
        run: ./gradlew :desktop-app:${{ matrix.task }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp desktop-app/build/compose/binaries/main/${{ matrix.format }}/${{ matrix.glob }} release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}
          path: release-assets/*

  publish:
    needs: [android-apk, desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract release notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" 'index($0, "## " ver) == 1 { f=1; next } f && /^## / { exit } f' RELEASE_NOTES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "MatrixTalk $GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "MatrixTalk ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            artifacts/*
