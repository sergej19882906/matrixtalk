name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Set up signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > matrix-messenger.jks
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          keystore.file=matrix-messenger.jks
          keystore.alias=${{ secrets.KEYSTORE_ALIAS }}
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.password=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: ./gradlew :app:assembleRelease

      - name: Build debug APK (no signing secrets)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: ./gradlew :app:assembleDebug


      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/MatrixTalk-${{ github.ref_name }}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/MatrixTalk-${{ github.ref_name }}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk

  desktop:
    env:
      WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
      WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
      MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            format: msi
            glob: '*.msi'
          - os: ubuntu-latest
            task: packageDeb
            format: deb
            glob: '*.deb'
          - os: macos-latest
            task: packageDmg
            format: dmg
            glob: '*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Package ${{ matrix.format }}
        shell: bash
        run: ./gradlew :desktop-app:${{ matrix.task }}

      - name: Smoke test packaged app
        # Startup regressions in the packaged (minified) app are invisible to
        # compile tasks and unit tests — launch the real binary and check output.
        shell: bash
        timeout-minutes: 5
        run: |
          set -u
          dir="desktop-app/build/compose/binaries/main/app/MatrixTalk"
          if [ ! -e "$dir" ]; then
            ./gradlew :desktop-app:createDistributable
          fi
          if [ -f "$dir/MatrixTalk.exe" ]; then bin="$dir/MatrixTalk.exe"; else
            bin="$dir/bin/MatrixTalk"
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
              runner="xvfb-run -a"
            elif [ "$RUNNER_OS" = "macOS" ]; then
              bin="desktop-app/build/compose/binaries/main/app/MatrixTalk.app/Contents/MacOS/MatrixTalk"
            fi
          fi
          if [ ! -e "$bin" ]; then
            echo "packaged binary not found, directory contents:"
            ls -laR "$dir" 2>&1 | head -30
            exit 1
          fi
          out=$(mktemp)
          ${runner:-} "$bin" >"$out" 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 $pid 2>/dev/null; then
            echo "Packaged app exited early:"; cat "$out"; exit 1
          fi
          kill $pid 2>/dev/null || true
          sleep 2
          if grep -qE "Exception in thread|InstanceCreationException|NoDefinitionFoundException|NoClassDefFoundError|UnsatisfiedLinkError|Could not create instance" "$out"; then
            echo "Packaged app logged exceptions:"; cat "$out"; exit 1
          fi
          echo "Packaged app smoke test OK"

      - name: Store check without sun.misc.Unsafe
        # Reproduces the installer jlink runtime (no jdk.unsupported module):
        # the prefs store must survive it (regression: v1.14.x desktop login crash).
        shell: bash
        run: ./gradlew :desktop-app:loginSmokeTestNoUnsafe

      - name: Sign MSI (Authenticode)
        # Requires secrets: WIN_PFX_BASE64 (PKCS#12 cert), WIN_PFX_PASSWORD.
        # Without them the MSI ships unsigned (SmartScreen warning on first run).
        if: runner.os == 'Windows' && env.WIN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktop-app/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          $pfx = "$env:RUNNER_TEMP/matrix-talk.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_PFX_BASE64))
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$pfx" /p "$env:WIN_PFX_PASSWORD" $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          echo "MSI signed: $($msi.Name)"

      - name: Codesign + notarize macOS app
        # Requires secrets: MAC_CERTIFICATE_BASE64 (Developer ID Application P12),
        # MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD.
        # Without them the DMG ships unsigned (Gatekeeper prompt on first run).
        if: runner.os == 'MacOS' && env.MAC_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          APP="desktop-app/build/compose/binaries/main/app/MatrixTalk.app"
          [ -d "$APP" ] || ./gradlew :desktop-app:createDistributable

          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/mac.p12"
          security create-keychain -p CIpass123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p CIpass123 build.keychain
          security import "$RUNNER_TEMP/mac.p12" -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k CIpass123 build.keychain

          CERT_NAME=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$CERT_NAME" ] || { echo "No Developer ID Application identity found in the P12"; exit 1; }
          echo "Signing with: $CERT_NAME"

          codesign --deep --force --options runtime --sign "$CERT_NAME" --timestamp "$APP"
          codesign --verify --deep --strict "$APP"

          DMG=$(ls desktop-app/build/compose/binaries/main/dmg/*.dmg | head -1)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          echo "DMG signed and notarized: $DMG"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp desktop-app/build/compose/binaries/main/${{ matrix.format }}/${{ matrix.glob }} release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}
          path: release-assets/*

  publish:
    needs: [android-apk, desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract release notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" 'index($0, "## " ver) == 1 { f=1; next } f && /^## / { exit } f' RELEASE_NOTES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "MatrixTalk $GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "MatrixTalk ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            artifacts/*

      - name: Trigger AppImage build
        # Releases created with GITHUB_TOKEN do not emit release events, so the
        # AppImage workflow cannot trigger on release publication — dispatch it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run linux-appimage.yml --ref main -f tag="${GITHUB_REF_NAME}"
