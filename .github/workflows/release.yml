name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (must match gradle.properties)
        required: true
        type: string
      source_ref:
        description: Optional recovery branch or commit (original tag must be its ancestor)
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python -I scripts/release_metadata.py outputs --root . --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release validation tests
        run: |
          python -m pip install PyYAML==6.0.2
          python -I -m unittest discover -s scripts -p 'test_*.py'
          python -I scripts/validate_workflows.py .github/workflows

  android-apk:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      # Same wrapper-dists prefill as the desktop matrix (see below for rationale).
      - name: Warm Gradle wrapper distribution
        shell: bash
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | tr -d '\r' | sed 's#\\:#:#g')
          name=$(basename "$url" .zip)
          version=$(printf '%s' "$name" | sed 's/^gradle-//; s/-bin$//; s/-all$//')
          hash=$(printf '%s' "$url" | md5sum | cut -d' ' -f1)
          dir="$HOME/.gradle/wrapper/dists/$name/$hash"
          marker="$dir/$name.zip.ok"
          if [ ! -f "$marker" ]; then
            mkdir -p "$dir"
            for src in "$url" "https://mirrors.cloud.tencent.com/gradle/$name.zip" "https://mirrors.huaweicloud.com/gradle/$name.zip"; do
              if curl -fL --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 15 -o "$dir/$name.zip" "$src"; then
                (cd "$dir" && python -c "import zipfile; zipfile.ZipFile('$name.zip').extractall('.')" && touch "$marker" "gradle-$version/$name.zip.ok")
                break
              fi
            done
          fi
      # Same CDN-fallback as the desktop matrix: let the wrapper use a healthy mirror.
      - name: Point wrapper at mirror when Gradle CDN is degraded
        shell: bash
        run: |
          if curl -sIL -m 20 "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o /dev/null; then
            echo "primary Gradle CDN is healthy"
          else
            echo "primary Gradle CDN degraded — pointing wrapper at tencent mirror"
            python - <<'PY'
            p = 'gradle/wrapper/gradle-wrapper.properties'
            s = open(p, encoding='utf-8').read()
            open(p, 'w', encoding='utf-8', newline='').write(
                s.replace('https\\://services.gradle.org/distributions', 'https://mirrors.cloud.tencent.com/gradle')
            )
            PY
          fi
      - name: Set up Android signing
        run: python -I scripts/android-release.py prepare
      - name: Build APK and validate release metadata
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then variant=Release; else variant=Debug; fi
          ./gradlew verifyReleaseMetadata -PreleaseTag="$RELEASE_TAG" ":app:assemble$variant"
      - name: Verify APK version and signature
        run: python -I scripts/android-release.py verify "$RELEASE_VERSION" "$RELEASE_VERSION_CODE" "$RELEASE_TAG"
      - name: Clean up Android signing files
        if: always()
        run: python -I scripts/android-release.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk
          if-no-files-found: error

  desktop:
    needs: metadata
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
      WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
      MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            format: msi
          - os: ubuntu-latest
            task: packageDeb
            format: deb
          - os: macos-15-intel
            task: packageDmg
            format: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      # services.gradle.org had long 504/timeout waves: the wrapper gives up after 10s.
      # Prefill the wrapper dists cache from the primary URL or cloud mirrors
      # (Tencent/Huawei are reachable when the Gradle CDN degrades).
      - name: Warm Gradle wrapper distribution
        shell: bash
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | tr -d '\r' | sed 's#\\:#:#g')
          name=$(basename "$url" .zip)
          version=$(printf '%s' "$name" | sed 's/^gradle-//; s/-bin$//; s/-all$//')
          hash=$(printf '%s' "$url" | md5sum | cut -d' ' -f1)
          dir="$HOME/.gradle/wrapper/dists/$name/$hash"
          marker="$dir/$name.zip.ok"
          if [ ! -f "$marker" ]; then
            mkdir -p "$dir"
            ok=""
            for src in \
              "$url" \
              "https://mirrors.cloud.tencent.com/gradle/$name.zip" \
              "https://mirrors.huaweicloud.com/gradle/$name.zip"; do
              echo "trying $src"
              if curl -fL --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 15 -o "$dir/$name.zip" "$src"; then
                ok=1
                echo "downloaded from $src"
                break
              fi
            done
            if [ -z "$ok" ]; then
              echo "All sources failed; letting the wrapper try the primary URL itself"
              exit 1
            fi
            (cd "$dir" && python -c "import zipfile; zipfile.ZipFile('$name.zip').extractall('.')" && touch "$marker" "gradle-$version/$name.zip.ok")
          fi
          echo "gradle dist warmed at $dir"
      - name: Prepare macOS signing before packaging
        if: runner.os == 'macOS'
        run: python -I scripts/mac-release.py prepare
      # Belt and braces: if the warm prefill was not accepted (platform-specific
      # wrapper validation), let the wrapper itself download from a healthy mirror.
      - name: Point wrapper at mirror when Gradle CDN is degraded
        shell: bash
        run: |
          if curl -sIL -m 20 "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o /dev/null; then
            echo "primary Gradle CDN is healthy"
          else
            echo "primary Gradle CDN degraded — pointing wrapper at tencent mirror"
            python - <<'PY'
            p = 'gradle/wrapper/gradle-wrapper.properties'
            s = open(p, encoding='utf-8').read()
            open(p, 'w', encoding='utf-8', newline='').write(
                s.replace('https\\://services.gradle.org/distributions', 'https://mirrors.cloud.tencent.com/gradle')
            )
            PY
          fi
      - name: Package ${{ matrix.format }}
        shell: bash
        env:
          PACKAGE_TASK: ${{ matrix.task }}
        run: ./gradlew verifyReleaseMetadata -PreleaseTag="$RELEASE_TAG" :desktop-app:createDistributable ":desktop-app:$PACKAGE_TASK"
      - name: Install virtual display for Linux smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Smoke test packaged app
        shell: bash
        timeout-minutes: 5
        run: bash scripts/smoke-desktop.sh
      - name: Store check without sun.misc.Unsafe
        shell: bash
        run: ./gradlew :desktop-app:loginSmokeTestNoUnsafe
      - name: Verify MSI version and optionally sign it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem "desktop-app/build/compose/binaries/main/msi/*.msi")
          if ($packages.Count -ne 1) { throw "Expected exactly one MSI" }
          ./scripts/verify-sign-windows.ps1 -ExpectedVersion $env:RELEASE_VERSION -PackagePath $packages[0].FullName
      - name: Verify DEB metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(desktop-app/build/compose/binaries/main/deb/*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = amd64
      - name: Verify DMG contents and optionally notarize
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          packages=(desktop-app/build/compose/binaries/main/dmg/*.dmg)
          test "${#packages[@]}" -eq 1
          python -I scripts/mac-release.py verify "$RELEASE_VERSION" "${packages[0]}"
      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: python -I scripts/mac-release.py cleanup
      - name: Prepare artifact
        shell: bash
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          packages=(desktop-app/build/compose/binaries/main/"$PACKAGE_FORMAT"/*."$PACKAGE_FORMAT")
          test "${#packages[@]}" -eq 1
          mkdir -p release-assets
          cp "${packages[0]}" release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [metadata, android-apk, desktop]
    runs-on: ubuntu-latest
    env:
      GH_HOST: github.com
      GH_REPO: ${{ github.repository }}
      GH_PROMPT_DISABLED: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true
      - name: Validate complete artifact set
        run: python -I scripts/release_metadata.py artifacts --root . --tag "$RELEASE_TAG" --directory artifacts --manifest-output artifacts/release-manifest.json
      - name: Extract exact release notes and source provenance
        run: |
          python -I scripts/release_metadata.py notes --root . --tag "$RELEASE_TAG" --output release-notes.md
          python -I scripts/release_source.py "$RELEASE_SOURCE_SHA" release-notes.md
      - name: Publish complete release (resume draft safely)
        run: python -I scripts/publish-release.py "$RELEASE_TAG" artifacts release-notes.md
      - name: Trigger separate AppImage build
        run: gh workflow run linux-appimage.yml --ref main -f tag="$RELEASE_TAG" -f source_ref="$RELEASE_SOURCE_SHA"
      - name: AppImage status
        run: printf 'AppImage is a separate workflow; publication of APK/MSI/DMG/DEB does not imply AppImage succeeded.\n' >> "$GITHUB_STEP_SUMMARY"
