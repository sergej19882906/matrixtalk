name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Compile Desktop targets
        run: ./gradlew :shared:compileKotlinDesktop :desktop-app:compileKotlinDesktop

  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.bridges.yml
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-password/testpass123/g' .env
          sed -i 's/replace-with-a-long-random-secret/testsecret123/g' .env
          sed -i 's/replace-with-another-random-secret/testadminsecret123/g' .env
          docker compose -f docker-compose.bridges.yml config --quiet

      - name: Validate docker-compose.arm64.yml override
        run: |
          docker compose -f docker-compose.bridges.yml -f docker-compose.arm64.yml config --quiet
