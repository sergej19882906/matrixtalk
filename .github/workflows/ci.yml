name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Unit tests (shared, Android target)
        run: ./gradlew :shared:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Compile Desktop targets
        run: ./gradlew :shared:compileKotlinDesktop :desktop-app:compileKotlinDesktop

      - name: Unit tests (shared, Desktop target)
        run: ./gradlew :shared:desktopTest

      - name: Package and smoke test Desktop app
        # Catches packaged-only startup regressions (DI, ProGuard, natives).
        shell: bash
        run: |
          set -u
          ./gradlew :desktop-app:createDistributable
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            runner="xvfb-run -a"
          else
            runner=""
          fi
          bin="desktop-app/build/compose/binaries/main/app/MatrixTalk/bin/MatrixTalk"
          test -x "$bin" || { echo "packaged binary not found"; exit 1; }
          out=$(mktemp)
          $runner "$bin" >"$out" 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 $pid 2>/dev/null; then
            echo "Packaged app exited early:"; cat "$out"; exit 1
          fi
          kill $pid 2>/dev/null || true
          sleep 2
          if grep -qE "Exception|Error" "$out"; then
            echo "Packaged app logged exceptions:"; cat "$out"; exit 1
          fi
          echo "Packaged app smoke test OK"

  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.bridges.yml
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-password/testpass123/g' .env
          sed -i 's/replace-with-a-long-random-secret/testsecret123/g' .env
          sed -i 's/replace-with-another-random-secret/testadminsecret123/g' .env
          docker compose -f docker-compose.bridges.yml config --quiet

      - name: Validate docker-compose.arm64.yml override
        run: |
          docker compose -f docker-compose.bridges.yml -f docker-compose.arm64.yml config --quiet
